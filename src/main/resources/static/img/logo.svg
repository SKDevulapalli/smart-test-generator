<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient - Google Blue glass effect -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <!-- Highlight gradient for glass shine -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.5" />
      <stop offset="35%" style="stop-color:white;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Main card background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#glassGradient)" opacity="0.95"/>
  
  <!-- Glass shine overlay (top reflection) -->
  <rect x="4" y="4" width="120" height="50" rx="24" fill="url(#shine)"/>
  
  <!-- Inner highlight border -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  
  <!-- K Letter in white -->
  <g fill="white">
    <!-- Left vertical line -->
    <rect x="30" y="24" width="13" height="80" rx="6.5"/>
    <!-- Top diagonal -->
    <path d="M 43 28 L 80 50" stroke="white" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- Bottom diagonal -->
    <path d="M 80 70 L 43 92" stroke="white" stroke-width="13" stroke-linecap="round" fill="none"/>
  </g>
</svg>
