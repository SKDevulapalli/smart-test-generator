# Kade Test Gen Configuration
spring.application.name=kade-test-gen
server.port=${PORT:8081}

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf settings
spring.thymeleaf.cache=false

# GitHub settings (optional - can be set via UI)
github.token=${GITHUB_TOKEN:}

# =============================================
# Microsoft Copilot / Azure OpenAI Integration
# =============================================
# To enable AI-powered test generation, configure your Azure OpenAI credentials:
#
# Option 1: Set environment variables (recommended for security)
#   AZURE_OPENAI_ENDPOINT=https://your-resource.openai.azure.com
#   AZURE_OPENAI_API_KEY=your-api-key
#   AZURE_OPENAI_DEPLOYMENT=gpt-4
#
# Option 2: Set directly in this file (not recommended for production)
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:gpt-4}
azure.openai.api-version=2024-02-15-preview

# =============================================
# Selenium / Browser Configuration
# =============================================
# For cloud deployments (Railway, Heroku, etc.), use a remote browser service:
# 
# Option 1: Browserless.io (recommended)
#   Use a regional endpoint with the /webdriver path:
#   SELENIUM_REMOTE_URL=https://production-sfo.browserless.io/webdriver?token=YOUR_API_KEY
#   
#   Available regions:
#   - production-sfo.browserless.io (US West)  
#   - production-lon.browserless.io (Europe UK)
#   - production-ams.browserless.io (Europe Amsterdam)
#
#   Legacy format (auto-converted by the app):
#   SELENIUM_REMOTE_URL=wss://chrome.browserless.io?token=YOUR_API_KEY
#
# Option 2: Any Selenium Grid
#   SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
selenium.remote.url=${SELENIUM_REMOTE_URL:}

