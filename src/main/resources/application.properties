# Kade Test Gen Configuration
spring.application.name=kade-test-gen
server.port=8081

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf settings
spring.thymeleaf.cache=false

# GitHub settings (optional - can be set via UI)
github.token=${GITHUB_TOKEN:}

# =============================================
# Microsoft Copilot / Azure OpenAI Integration
# =============================================
# To enable AI-powered test generation, configure your Azure OpenAI credentials:
#
# Option 1: Set environment variables (recommended for security)
#   AZURE_OPENAI_ENDPOINT=https://your-resource.openai.azure.com
#   AZURE_OPENAI_API_KEY=your-api-key
#   AZURE_OPENAI_DEPLOYMENT=gpt-4
#
# Option 2: Set directly in this file (not recommended for production)
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:gpt-4}
azure.openai.api-version=2024-02-15-preview
